name: Multiple Dependent Jobs Demo

on: [push]

jobs:
  job_on_ubuntu:
    name: Job on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Print Ubuntu message
        run: echo "This job is running on Ubuntu"

  windows_job:
    name: A windows job
    runs-on: windows-latest

    steps:
      - name: Print Windows message
        run: echo "This job is running on Windows"

  mac_job:
    name: A job that runs on Mac after first jobs
    runs-on: macos-latest
    needs: [job_on_ubuntu, windows_job]

    steps:
      - name: Print Mac message
        run: echo "This Mac job runs after Ubuntu and Windows jobs"

  final_job:
    name: A Final job
    runs-on: ubuntu-latest
    needs: mac_job

    steps:
      - name: Print final message
        run: echo "This final job runs after the Mac job"
